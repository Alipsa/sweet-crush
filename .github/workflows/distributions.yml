name: Build Distributions

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-distributions:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Distribution
            os: ubuntu-latest
            profile: dist-linux
            artifact_name: sweet-crush-linux
          - name: macOS Distribution
            os: macos-latest
            profile: dist-macos
            artifact_name: sweet-crush-macos
          - name: Windows Distribution
            os: windows-latest
            profile: dist-windows
            artifact_name: sweet-crush-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ensure distribution scripts are executable
        if: runner.os != 'Windows'
        run: chmod +x scripts/dist/*.sh

      - name: Build platform distribution
        run: mvn -B -P${{ matrix.profile }} clean package -DskipTests

      - name: Upload distribution zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/dist/sweet-crush-*.zip
          if-no-files-found: error

  cleanup-old-artifacts:
    name: Clean up old artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-distributions
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from previous runs
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRunId = context.runId;
            const { owner, repo } = context.repo;

            // Get the workflow ID for this run so we only touch our own artifacts
            const currentRun = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: workflowRunId
            });
            const workflowId = currentRun.data.workflow_id;

            // List all artifacts in this repo
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            // Delete artifacts from older runs of THIS workflow only
            const artifactNames = ['sweet-crush-linux', 'sweet-crush-macos', 'sweet-crush-windows'];
            for (const artifact of artifacts) {
              if (artifact.workflow_run?.id !== workflowRunId
                  && artifact.workflow_run?.workflow_id === workflowId
                  && artifactNames.includes(artifact.name)) {
                console.log(`Deleting artifact: ${artifact.name} (run ${artifact.workflow_run?.id})`);
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              }
            }
